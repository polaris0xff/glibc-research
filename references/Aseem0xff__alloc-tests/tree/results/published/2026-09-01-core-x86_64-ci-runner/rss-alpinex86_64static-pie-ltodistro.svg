<svg xmlns="http://www.w3.org/2000/svg" width="810" height="252" viewBox="0 0 810 252" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#1b1f24">Peak resident set relative to the control — alpine / x86_64 / static-pie-lto / distro</text>
