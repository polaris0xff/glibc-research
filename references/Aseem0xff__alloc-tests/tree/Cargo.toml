[workspace]
resolver = "2"
members = [
    "crates/alloc-bench",
    "crates/alloc-runner",
    "crates/rgalloc-shim",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Aseem0xff/alloc-tests"

[profile.release]
opt-level = 2
codegen-units = 1
